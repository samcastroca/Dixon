# Entity resolution seed (spec section 6.2): every spelling a source may use, mapped to one
# canonical team per competition. Canonical names are the official ones, in UTF-8 with accents.
#
# Structure: <competition code> -> <canonical name> -> [aliases]. The canonical name is always an
# alias of itself, and matching happens on a normalised key (lowercase, accents stripped,
# punctuation and extra whitespace removed), so "Atlético de Madrid" and "Atletico de Madrid"
# never need two entries. An unknown spelling raises UnknownTeamError; it is never guessed.

