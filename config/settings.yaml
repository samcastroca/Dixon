# Single source of truth for every tunable. No magic numbers in code.
# Any value can be overridden by an environment variable: PREDICTOR_<SECTION>__<KEY>
# (e.g. PREDICTOR_DATABASE__HOST=localhost). Secrets live in the environment only.

app:
  name: predictor
  version: "0.1.0"
  log_level: INFO
  # Everything is stored in this timezone; sources are converted from their local one.
  storage_timezone: UTC

database:
  host: db
  port: 5432
  name: predictor
  user: predictor
  # Seconds before a connection attempt gives up (keeps probes and tests fast).
  connect_timeout: 5
  # password: never here, only PREDICTOR_DATABASE__PASSWORD

mlflow:
  tracking_uri: http://mlflow:5000

api:
  host: 0.0.0.0
  port: 8000

# One block per data source (spec section 4). Everything the HTTP client needs is here.
sources:
  football_data_uk:
    base_url: https://football-data.co.uk/mmz4281
    # Built with the competition's source code and the four-digit season code.
    resource_template: "{season_code}/{source_code}.csv"
    user_agent: predictor/0.1 (research project)
    timeout_seconds: 30
    max_attempts: 4
    backoff_initial_seconds: 1.0
    backoff_max_seconds: 30.0
    backoff_jitter_seconds: 0.5
    # Politeness: at most one request per this many seconds.
    min_interval_seconds: 1.0
    # The site mixes encodings across seasons; tried in order.
    encodings: [utf-8-sig, cp1252]

ingestion:
  default_source: football_data_uk
  default_seasons: 2014-2025

# Phase 2: how staging rows become clean tables. Column names are configuration because they
# belong to the source's file layout, not to the pipeline.
processing:
  source: football_data_uk
  market: "1X2"
  # Used when a season file carries no kickoff time; the row is flagged kickoff_time_estimated.
  default_kickoff_local_time: "15:00"
  # A row without a full-time result is not "played"; this source cannot tell us which of the
  # other outcomes happened, so it gets one explicit status.
  status_when_result_missing: postponed
  columns:
    football_data_uk:
      date: Date
      time: Time
      home: HomeTeam
      away: AwayTeam
      goals: {home: FTHG, away: FTAG, ht_home: HTHG, ht_away: HTAG, result: FTR}
      stats:
        shots: [HS, AS]
        shots_on_target: [HST, AST]
        corners: [HC, AC]
        fouls: [HF, AF]
        yellows: [HY, AY]
        reds: [HR, AR]
      # `open` is the prefix of the opening 1X2 prices, `closing` of the closing ones (absent in
      # the older seasons, where only Pinnacle published them).
      bookmakers:
        - {code: B365, name: Bet365, open: B365, closing: B365C}
        - {code: BW, name: Bwin, open: BW, closing: BWC}
        - {code: PS, name: Pinnacle, open: PS, closing: PSC}
        - {code: WH, name: William Hill, open: WH, closing: WHC}

# Phase 3: the point-in-time feature store. Every number a feature depends on lives here.
features:
  version: v1
  # Each row is valid this long before kickoff, which is what keeps as_of_utc < kickoff_utc.
  as_of_offset_seconds: 1
  # Rounding every value keeps a rebuild identical across machines: pow() on glibc and on
  # the Windows runtime disagree in the last bit, and 1e-9 is far finer than any model needs.
  value_decimals: 9
  groups:
    elo: true
    form: true
    schedule: true
    # Off: this source publishes no capture time, so a quote cannot be proven pre-kickoff.
    market: false
  elo:
    defaults:
      k: 20.0
      home_advantage: 60.0
      initial_rating: 1500.0
      # G in R' = R + K*G*(S - E): 1.0 up to a one-goal margin, then this curve.
      two_goal_multiplier: 1.5
      large_margin_base: 11.0
      large_margin_divisor: 8.0
      # Every season start: R <- target + (1 - season_regression) * (R - target)
      season_regression: 0.25
      season_regression_target: 1500.0
    # The same knobs per competition; anything absent inherits the defaults above.
    per_competition:
      EPL: {}
      LALIGA: {}
  form:
    # Rolling means over the last N appearances, plus one exponentially weighted average.
    windows: [5, 10]
    ewma_halflife: 5.0
  schedule:
    congestion_window_days: 14
  market:
    # Which stored quote the group would use; Pinnacle closing prices cover every season.
    bookmaker: PS
    method: shin
    prefer_closing: true
    # Using a quote we cannot date has to be a decision, not an oversight.
    allow_missing_captured_at: false

# Phase 4: the walk-forward backtest (spec section 8). Not inside `features`, because the
# feature store's definition checksum hashes that whole section.
backtest:
  default_seasons: 2019-2025
  experiment: predictor-backtest
  # Which feature store the models read; empty means features.version.
  feature_version: null
  # 0 = one fit per test season. N = refit whenever the team with the fewest matches played
  # in that season has played N more; the source files carry no matchweek column.
  refit_every_matchweeks: 0
  # A fold with less history than this is skipped instead of fitted on nothing.
  min_train_matches: 380
  # Every model's RPS gap is reported against this one.
  reference_model: baseline_market
  metrics:
    ece_bins: 10
    log_loss_floor: 1.0e-15
  bootstrap:
    resamples: 2000
    confidence: 0.95
    # Fixed, so the same predictions always give the same interval.
    seed: 20260926
  report:
    directory: reports
    formats: [markdown, html]
  # The market benchmark (M0b) uses closing prices published without a capture time. It is a
  # benchmark, never a deployable model, which is why the exemption lives here and the feature
  # store's market group stays off.
  market_baseline:
    bookmaker: PS
    method: shin
    prefer_closing: true
    allow_missing_captured_at: true

# Competitions are data, not code. Adding a league must never require touching logic.
competitions:
  - code: EPL
    sport: football
    name: English Premier League
    country: England
    timezone: Europe/London
    sources:
      football_data_uk: E0
    default_kickoff_local_time: "15:00"
    rules:
      teams: 20
      relegation_slots: 3
      champions_league_slots: 4
      tiebreaker: goal_difference

  - code: LALIGA
    sport: football
    name: LaLiga
    country: Spain
    timezone: Europe/Madrid
    sources:
      football_data_uk: SP1
    default_kickoff_local_time: "21:00"
    rules:
      teams: 20
      relegation_slots: 3
      champions_league_slots: 4
      tiebreaker: head_to_head
