[project]
name = "predictor"
version = "0.1.0"
description = "Sports results prediction platform (EPL + LALIGA): 1X2 probabilities and scoreline distributions"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "httpx>=0.28",
    "matplotlib>=3.9",
    "mlflow-skinny>=3.0",
    "numpy>=2.1",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "psycopg[binary]>=3.2",
    "pymc[nutpie]>=6.3",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
    "structlog>=25.4",
    "tenacity>=9.1",
    "typer>=0.17",
    "uvicorn[standard]>=0.37",
]

[project.scripts]
predictor = "predictor.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=1.18",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "ANN",  # type annotations
    "S",    # bandit
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy credentials are the point
"alembic/**" = ["ANN"]     # generated migration scaffolding

[tool.mypy]
python_version = "3.12"
files = ["src/predictor", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

# The statistical stack of phase 5 ships no type information.
[[tool.mypy.overrides]]
module = ["scipy.*", "pymc.*", "pytensor.*", "arviz.*", "nutpie.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a live PostgreSQL (docker compose up -d db)",
    "slow: takes minutes rather than seconds (full-history rebuilds)",
]

[tool.coverage.run]
source = ["src/predictor"]
omit = ["src/predictor/dashboard/*"]
