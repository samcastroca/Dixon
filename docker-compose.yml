name: predictor

# Services for later phases (ingest, pipeline, train, dashboard) sit behind the `later`
# profile, so `docker compose up -d` starts exactly db + api + mlflow.
x-app: &app
  build:
    context: .
  image: predictor-app:local
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-predictor}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-predictor}
    PREDICTOR_MLFLOW__TRACKING_URI: http://mlflow:5000
  depends_on:
    db:
      condition: service_healthy
  # Some ISP resolvers refuse football-data.co.uk; ask public resolvers instead.
  dns: [1.1.1.1, 8.8.8.8]
  networks: [predictor]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-predictor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-predictor}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Development only: bound to loopback, never exposed beyond the host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-predictor} -d ${POSTGRES_DB:-predictor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [predictor]

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: predictor-mlflow:local
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-predictor}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mlflow
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health').read()\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [predictor]

  api:
    <<: *app
    command: ["uvicorn", "predictor.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ingest:
    <<: *app
    command: ["predictor", "ingest"]

  pipeline:
    <<: *app
    command: ["predictor", "process"]

  # --- stubs for later phases -------------------------------------------------
  train:
    <<: *app
    profiles: ["later"]
    command: ["predictor", "train"]

  dashboard:
    <<: *app
    profiles: ["later"]
    command: ["python", "-c", "raise SystemExit('dashboard is delivered in phase 7')"]
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  pgdata:
  mlflow-artifacts:

networks:
  predictor:
    driver: bridge
